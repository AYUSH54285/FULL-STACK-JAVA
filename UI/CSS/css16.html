<!DOCTYPE html>
<html lang="en">
  <head>
	<link rel="icon" href="logo.png">
	<meta charset="UTF-8">
	<style>
	  img{
		width:200px;
		height:200px;	  
	  }
	  #i1:hover{ border-radius:50px; }
	  #i2:hover{ border-radius:50%;  }
	  #i3:hover{ border-radius:20px 80px;  }	   
	</style>	
  </head>
  <body>
 	<h3>applying multiple selectors on elements</h3>
	<img src="images/abc.jpeg" id="i1">
	<img src="images/pqr.jpeg" id="i2">
	<img src="images/xyz.jpeg" id="i3">	
  </body>
</html>
