<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="icon" href="logo.png">
        <meta charset="UTF-8">
        <style>
            @keyframes bounce
            {
                100%{
                    transform:translateY(-60px);
                }
            }
            .main{
                display:flex; /*all comes side wise side*/
                justify-content:center;
            }
            .main div{
                width:25px;
                height:25px;
                background:blue;
                margin:5px;
                border-radius:50%;
                animation:bounce 1s infinite alternate linear; /*linear -> it synchronise animation*/
            }
            .main div:nth-child(2){
                animation-delay:0.3s;
            }
            .main div:nth-child(3){
                animation-delay:0.6s;
            }
        </style>
    </head>
    <body>
        <h3>bounce animations</h3>
        <div class="main">
            <div></div>
            <div></div>
            <div></div>
        </div>
        
    </body>
</html>
