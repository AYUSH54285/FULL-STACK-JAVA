<!DOCTYPE html>
<html lang="en">
<head>   <!--we can apply css for html and body tag, not for head tag-->
    <title>CSS</title>
</head>
<body style="background-color: pink;">
    <h3>Demo on Inline styles</h3>
    <h1 style="color: red;">Apple</h1>
    <p style="color: yellow;">Mango</p>    <!-- inline style is personnel styling it will not carry forward for same tag -->
    <div style="color: orange;">Orange</div>
    <input type="text" style="color:green; text-align:right;">
</body>
</html>
