<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="icon" href="logo.png">
        <meta charset="UTF-8">
        <style>
            @keyframes colors
                {
                0%{          /* this percentage is the total time at that stage example 0s 3s 7s 10s*/
                    background:blue;
                }
                30.5%{
                    background:green;
                }
                70%{
                    background:red;
                }
                100%{
                    background:yellow;
                }
            }
            body{
                animation:colors 10s;
            }
        </style>
    </head>
    <body>
        <h3>demo on animations</h3>
    </body>
</html>
