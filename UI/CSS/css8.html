<!-- Class Selector
used to defined/to apply same styles for group of instances or elements -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        .c1{
            background-color: pink;
        }
        .c2{
            background-color: #0000FF;  /*we can write #112233 to #123*/        
        }
        .c3{
            background-color: rgb(100,200,300);
        }
    </style>
    <!--
    Mapping:
    <tag class="class-name class2 class3.........." 
    -->
</head>
<body>
    <h3>Demo on Class</h3>
        <h1 class="c1">HTML</h1>
        <h1 class="c1">CSS</h1>
        <h1 class="c1">JavaScript</h1> 
        <h1 class="c2">HTML</h1>
        <h1 class="c2">CSS</h1>
        <h1 class="c2">JavaScript</h1>


        <span class="c3">Java</span>
        <p class="c3">Python</p>
        <div class="c3">Dot.net</div>
</body> 
</html>
