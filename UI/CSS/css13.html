<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        /* follow the order that is visited -> hover -> active otherwise styling is not working properly*/
        :visited{  /*we don't need to mention the combinators becuase visiting is done for only anchor tag*/
            color:blue;
        }

        a,h3:hover{  /* we need to mention selectors before classes that is called "combinators". If we don't use combinators then it will applied on all page */
            color: hotpink;
        }

        :active{
            color: green;
        }

        input:focus{
            outline: 2px solid blue;
        }

    /* input:blur{
            outline: 2px solid green;
        } */

        
        ol li:nth-child(odd){
		color:blue;
        }

        ol li:nth-child(even){
        color:teal;
        }	

        ol li:first-child{
        color:red;
        }

        ol li:last-child{
        color:green;
        }
    </style>
</head>
<body>
    <h3>demo on pseudo classes</h3>
    <a href="">google</a>
    <a href="">Youtube</a>
    <a href="">facebook</a>
    <a href="">instagram</a> <br>
    <br>
    <input type="text"> <br>
    <input type="text"> <br>

</body>
</html>
