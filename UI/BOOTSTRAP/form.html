<!DOCTYPE html>
<html lang="en">
  <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bootstrap Form Example</title>
	<link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
	<form>
		<div class="form-group">
			<label for="mailid">Email address</label>
			<input type="email" class="form-control" id="mailid" placeholder="Enter email">
			<span id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</span>
		</div>
		<div class="form-group">
			<label for="pwd">Password</label>
			<input type="password" class="form-control" id="pwd" placeholder="Password">
		</div>
		<button type="submit" class="btn btn-primary">Submit</button>
	</form>
  </body>
</html>
