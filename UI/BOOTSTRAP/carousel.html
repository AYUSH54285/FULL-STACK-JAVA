<!DOCTYPE html>
<html lang="en">
 <head>
   <title>BootStrap carousel</title>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
     <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

 </head>
 <body>     
	<h1 align="center">Images Carousel with indicators & controls</h1>
	<div class="container">
		<div id="demo" class="carousel  slide" data-ride="carousel" data-interval="2000">		<!-- carousel-fade -->
			<!-- Carousel indicators -->
			<ul class="carousel-indicators">
				<li data-target="#demo" data-slide-to="0"  ></li>
				<li data-target="#demo" data-slide-to="1"></li>
				<li data-target="#demo" data-slide-to="2"></li>
				<li data-target="#demo" data-slide-to="3"></li>
			</ul>
			<!-- images sliding -->
			<div class="carousel-inner">
				<div class="carousel-item active">
					<img src="a.jpg"  width="100%" height="400px">
				</div>
				<div class="carousel-item">
					<img src="b.jpeg"  width="100%" height="400px">
				</div>
				<div class="carousel-item">
					<img src="a.jpg"  width="100%" height="400px">
				</div>
				<div class="carousel-item">
					<img src="b.jpeg"  width="100%" height="400px">
				</div>
			</div>
       
			<!--	next & prev buttons -->
			<a class="carousel-control-prev" href="#demo" data-slide="prev">
				<span class="carousel-control-prev-icon" style="color:red;">Prev</span>
			</a>
			<a class="carousel-control-next" href="#demo" data-slide="next">
				<span class="carousel-control-next-icon" style="color:red;">Next</span>
			</a>
		</div>
	</div>
 </body>
</html>
