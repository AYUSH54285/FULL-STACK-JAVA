<!-- CSS properties  -->
<!DOCTYPE html>
<html lang="en"> 
  <head>
    <link rel="icon" href="good.webp"> 
	<style>
	   p{
	    background:cyan;
	   }
	</style>
  </head>
  <body> 
	<h2>demo on css Shadows</h2>
	<!-- diagonal shadows -->
	<p style="box-shadow:-3px -3px;">Shadow for Top Left corner</p>
	<p style="box-shadow:3px -3px blue;">Shadow for Top Right corner</p>
	<p style="box-shadow:-3px 3px green;">Shadow for Bottom Left corner</p>
	<p style="box-shadow:3px 3px red;">Shadow for Bottom Right corner</p>
		
	<!-- one side shadows -->
	<h1 style="box-shadow:-4px 0 orange;">Shadow for left side only</h1>
	<h1 style="box-shadow:4px 0 orange;">Shadow for right side only</h1>
	<h1 style="box-shadow:0 4px orange;">Shadow for bottom side only</h1>
	<h1 style="box-shadow:0 -4px orange;">Shadow for top side only</h1>
	
	<!-- round the element shadow -->
	<img src="images/nature.webp" style="box-shadow:-2px -2px 15px red;">
	<br> <Br>
	<img src="images/nature.webp" style="box-shadow:0 0 25px blue;">	
	<br> <br> <br>
	
	<!-- multi layered shadow -->
	<img src="images/tenor.gif" style="box-shadow:0 0 10px red,0 0 15px blue,0 0 20px green;">
	
	<!-- text shadow -->		
	<h1 style="text-shadow:1px 1px hotpink;">Yarrapati</h1>
	
	<h1 style="text-shadow:0 0 5px blue,0 0 10px cyan,0 0 15px teal;">Siva Kumar</h1>
  </body>
</html>
