<!-- CSS properties  -->
<!DOCTYPE html>
<html lang="en"> 
  <head>
    <link rel="icon" href="good.webp"> 
	<style>
	  body{
		background-image:url(a.jpeg);
		background-size:cover;
	  }
	  [type="checkbox"]{
		accent-color:red; /* used to color of radio button & checkbox (CSS3) */
	  }
	  [type="radio"]{
		accent-color:green;  
	  }	  
	 
	  h1{
		background:#000;
		color:#f00;
	  }
	  .op1{
		opacity:0.1; 
		/* used to set the transparent for background (CSS3).
			opacity value b/w 0 to 1.0	*/
	  }
	  .op2{ opacity:1; }
	  .op3{ opacity:0.5; }
	  .op4{ opacity:0.7; }
	</style>
  </head>
  <body> 
   	<h3>demo on accent-color</h3>  
	<input type="checkbox"> <label>Apple</label> <br>
	<input type="radio"> <label>Mango</label>
	
	<h3>demo on opacity</h3>
	<h1 class="op1">90% transparent</h1>
	<h1 class="op2">no transparent</h1>
	<h1 class="op3">50% transparent</h1>
	<h1 class="op4">30% transparent</h1>		
	</div>
  </body>
</html>
