<!-- CSS properties  -->
<!DOCTYPE html>
<html lang="en"> 
  <head>
    <link rel="icon" href="good.webp"> 
	<style>
	  .cr1{
	    cursor: cell; /* used to change mouse pointer */
	  }
	  .cr2{ cursor: crosshair; }
	  .cr3{ cursor: e-resize; }
	  .cr4{ cursor: help; }
	  .cr5{ cursor: move; }
	  .cr6{ cursor: n-resize; }
	  .cr7{ cursor: not-allowed; }
	  .cr8{ cursor: pointer; }
	  .cr9{ cursor: progress; }
	  .cr10{ cursor: s-resize; }
	  .cr11{ cursor: text; }
	  .cr12{ cursor: url(a.png),auto; } 
	  .cr13{ cursor: wait; }
	  .cr14{ cursor: zoom-in; }
	  .cr15{ cursor: zoom-out; }
	</style>
  </head>
  <body> 
 	<h3>demo on mouse pointers</h3>
	<button class="cr1">cell</button>
	<button class="cr2">crosshair</button>
	<button class="cr3">e-resize</button>
	<button class="cr4">help</button>
	<button class="cr5">move</button>
	<button class="cr6">n-resize</button>
	<button class="cr7">not-allowed</button>
	<button class="cr8">pointer</button>
	<button class="cr9">progress</button>
	<button class="cr10">s-resize</button>
	<button class="cr11">text</button>
	<button class="cr12">url</button>
	<button class="cr13">wait</button>
	<button class="cr14">zoom-in</button>
	<button class="cr15">zoom-out</button>
  </body>
</html>
