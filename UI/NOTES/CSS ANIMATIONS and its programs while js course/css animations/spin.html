<!DOCTYPE html>
<html lang="en"> 
  <head>
	<style>
		@keyframes spin {
		  100%{ transform:rotate(360deg); }
		}
		.loader {
			width:150px;
			height:150px;
			border:30px solid #2390ED;
			border-top:30px solid #21C6F6;
			border-radius:50%;
			animation:spin 2s linear infinite;
		}
	</style>
	</head>
	<body>
		<div class="loader"></div>
	</body>
</html>
