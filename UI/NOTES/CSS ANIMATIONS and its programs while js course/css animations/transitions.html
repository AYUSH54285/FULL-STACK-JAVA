<!-- example on  css transitions  -->		 
<!DOCTYPE html>
<html lang="en">
  <head>
	  <title>transitions</title>
	  <link rel="icon" href="logo1.png"/>		
      <meta charset="UTF-8"/>
	  <style>
		h1{
			background:#3300ff;
			color:white;
			width:200px;
			margin:auto;
			text-align:center;
			transition:background 2s, font-size 2s, width 2s;
		}
		h1:hover{
			width:600px;  
			font-size:80px;
			background:red;
		}
		input{
			outline:none;
			width:200px;
			font-size:22px;
			transition:box-shadow 500ms;
		}
		input:hover{
			box-shadow:1px 1px 10px red;
		}
	  </style>
   </head>		 
  <body>
		<h3>demo on Transition</h3>
 		<h1>Siva Kumar Y</h1>
		<input type="text"/> <bR> <Br>
		<input type="text"/> <bR> <Br>
   </body>
</html>
