<!-- example on custom animations -->
<!DOCTYPE html>
<html lang="en">
 <head>
    <title>CSS Animations</title>
	<style>
		@keyframes moving
		{
			0%{transform:translate(10px, 10px);  }
			20%{transform:translate(1300px, 700px);  }
			35%{transform:translate(1300px, 10px);  }
			65%{transform:translate(10px, 700px);  }
			80%{transform:translate(650px, 10px);  }
			100%{transform:translate(650px, 350px);  }
		}
		/*		timing:
				0s		2s		1.5s			3s		1.5s		2s   =   10s
				1			2			3				4			5			6		*/
		 img{
			animation-name:moving;
			animation-duration:10s;      
			animation-iteration-count:infinite;
			animation-direction:alternate;
			animation-delay:3s;
		}
	</style>
 </head>
 <body>
		<h3>demo on image moving animation</h3>
		<img src="images/emoji.png" width="60px" height="60px"/>

 </body>
</html>
