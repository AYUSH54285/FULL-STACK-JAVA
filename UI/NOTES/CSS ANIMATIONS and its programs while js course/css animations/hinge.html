<!DOCTYPE html>
<html lang="en"> 
  <head>
	<style>
@keyframes swing {
  20% {
    transform: rotate(-15deg);
  }
  40% {
    transform: rotate(10deg);
  }
  60% {
    transform: rotate(-5deg);
  }
  80% {
    transform: rotate(3deg);
  }
  100% {
    transform: rotate(0deg);
  }
}

.swing {
  animation: swing 1s ease-in-out;
}

	</style>
	</head>
	<body>
		<div class="swing">Hinge Animation</div>

	</body>
</html>
