<!DOCTYPE html>
<html lang="en"> 
  <head>
	<style>	
		/* custom animation sliding text from left ot right */
		@keyframes slideInLeft 
		{
		  from {
			transform: translateX(-100%);
			opacity: 0;
		  }
		  to {
			transform: translateX(0);
			opacity: 1;
		  }
		}
		.slide-in-left {
			animation: slideInLeft 1s ease-out;
		}	
	</style>
  </head>
  <body>
	<h1 class="slide-in-left">Slide In from Left</h1>
	<div class="slide-in-left">Siva Kumar Y</div>	
  </body>
</html>
