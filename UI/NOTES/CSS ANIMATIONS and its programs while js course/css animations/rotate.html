<!DOCTYPE html>
<html lang="en"> 
  <head>
	<style>	
		/* custom animation for rotate text 
		  you can change deg as per your need */
		@keyframes rotate {
		  from {
			transform: rotate(0deg);
		  }
		  to {
			transform: rotate(360deg);
		  }
		}
		.rotate {
		  animation: rotate 3s linear infinite;
		}
	</style>
  </head>
  <body>
	<h1 class="rotate" style="display:inline-block;">Rotate Animation</h1>
	<img src="images/rose.jpeg" class="rotate">
  </body>
</html>
