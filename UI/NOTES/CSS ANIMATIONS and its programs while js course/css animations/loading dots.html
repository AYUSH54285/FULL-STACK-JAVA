<!-- animations -->
<!DOCTYPE html>
<html lang="en">
 <head>
    <meta charset="UTF-8">
	<style>
		@keyframes  bounce
		{
			100%{ transform: translateY(100px); }
		}
		.main{
		    display:flex;
			justify-content:center;
		}
		.main div{
		   width:25px;
		   height:25px;
		   background:blue;
		   margin:5px;
		   border-radius:50%;
		   animation:bounce 1s infinite alternate linear;
		}
		.main div:nth-child(2){
			animation-delay:0.2s;
		}
		.main div:nth-child(3){
			animation-delay:0.4s;
		}
		.main div:nth-child(4){
			animation-delay:0.6s;
		}
		.main div:nth-child(5){
			animation-delay:0.8s;
		}
	</style>
 </head>
 <body>
		<h1>bounce animation</h1>
		<div class="main">
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
		</div>
	
	
 </body>
</html>
