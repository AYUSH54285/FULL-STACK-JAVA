<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h3> demo on dom events</h3>
    <button id="bt1" >Push here</button>
    <button id="bt2" >Pull here</button>

    <!--when we did not write the event with the HTML code(statically) then we can add event dynamically -->

    <script>
        const b1 = document.querySelector("#bt1");
        b1.onclick = function(){   // here we using "properties" for implementing event dynamically.
                        alert("button pushed")
                    }

        /*     we can also use anonymous object for sam operation
        document.querySelector("#bt1").onclick = function(){
                                                    alert("button pushed")
                                                }
        */

        const b2 = document.querySelector("#bt2");
        b2.addEventListener("click",function(){  //NOTE : do not write 'on' with event while implementing event dynamically
            alert("button pulled");
        });
        /*
        document.querySelector("#bt2").addEventListener("click",function(){  
                                                                            alert("button pulled");
                                                                      });
        */
    </script>
</body>
</html>
