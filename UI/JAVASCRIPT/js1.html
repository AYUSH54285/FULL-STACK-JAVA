What is Scripting? 
=> A script program code that doesn't need pre-processing (eg. compiling) before running. 
=> In the context of web browser, scripting usually refers to program code written in js that is executed by the browser when a page is loaded,

Type of script:
Script are classified into two types
1. Client-side script
2. Server-side script

Client-side script:  
=> These script are getting executed within the web browser(client)
=> Here we don't need any software
=> These script are used for client side validations(data verification and data validations)
    Ex-JS,VBScript,typescript etc.

Server-side script:
A script which executes in server machine with support of the web-server/app-server software's like IIS(internet Information Service), Tomcat, JBOSS etc.
These scripts are used for server side validations(authentication and authorization).
    ex-> php, asp.net, VueScript, Express Script, NodeJS, cgi, perl etc.

When JavaScript was created, it initially had another name: “LiveScript”. But Java 
was very popular at that time, so it was decided that positioning a new language 
as a “younger brother” of Java would help. 
But as it evolved, JavaScript became a fully independent language with its own 
specification called ECMAScript, and now it has no relation to Java at all.  
✔ Later JavaScript became an ECMA (European Computer Manufacturers 
Association Script) standard in 1997. ECMAScript is the official name of the 
language.

What is the use of javascript? 
1. Javascript used to develop interactive webpages 
2. Also used to add some functionalities to webpage 
JS used  web dev, mobile app, gaming, animations, networking app, AI ... 
Why we Use JavaScript? 
Using HTML/CSS, we can only design a web page but it’s not supported to perform 
logical operations such as calculations, decision making and repetitive tasks, 
dynamically displaying output, reading inputs from the user, and updating content 
on webpage at client side. Hence to perform these entire tasks at client side we 
need to use JavaScript. 
What is used? 
There are so many web applications running on the web that are using JavaScript like 
Google, Facebook, twitter, amazon, YouTube etc. 
It is used to create interactive webpages.  
JS used to add functionality to webpages 
It is mainly used for:         
1. Client-side verifications and validations 
2. Dynamic drop-down menus   
3. Displaying date and time 
4. Build forms that respond to user input without accessing a server. 
5. Displaying popup windows and dialog boxes (like alert dialog box, confirm dialog 
box and prompt dialog box) 
6. Manipulate HTML "layers" including hiding, moving, and allowing the user to 
drag them around a browser window. 
etc... 
Limitations of JavaScript 
Client-Side JavaScript has some limitations which are given below; 
1. Client-side JavaScript does not allow reading and writing of files. 
2. It doesn't have any multithreading or multiprocessing capabilities. 
3. it doesn't support db connections.

    <title>JS</title>

    <h1>Demo on inline script</h1>
    <button type="button" onclick="alert('button pushed')">push here</button> <!-- event name is onclick where we use alert function -->
    <button type="button" onclick="alert('button pulled')">pull here</button> <!-- onclick is action and alert is reaction-->
    <h2 ondblclick="alert('hey, you clicked 2 times')"> double click here</h2>
</body>
</html>
