<!--
Loosely Typed : 
-> in a varibale we can store any type of data, but only one data 

dynamically typed:
-> We can use a variable directly without declaring it in javascript, it’s called dynamic 
typed programming. that declartion done in background
-> these varible declared and stored in window object (can access inside console example: window.i )


-->



<!--example on JS variables-->
<h3>demo on Loosely typed and dynamically declared </h3>
<script>
    let n; // we can store any type of value that is called loosely typed
    n=new Date(); // n=[10,20,30] or n=100n or n=null or n=true or n="ecma" or n=10 we can store any type of data hence it is loosely typed
    document.write(n,'<br>');

    i=100;     //dynamically declared -> browser is handling the declartion. we can or can not declare. 
    // they are declaring the variable in the window object by default and we can check this with window.i in console.
    window.write(i,'<br>');           //window.i
    j="ecma";    //dynamically declared
    window.write(j,'<br>');           //window.j
</script>
