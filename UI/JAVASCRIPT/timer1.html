<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <h3>demo on timer functions</h3>
    <script>
        window.setTimeout(function(){alert("msg from timeout")},"5000");
        window.setInterval(function(){alert("meg from timeout")},"5000");           
    </script>
</body>
</html>
