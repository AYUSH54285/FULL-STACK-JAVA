<!--
=> data minipulations(reteriving , modifying, deleting of data):
=> used in paired tags(output elements)                   => used in input elements
-> eleobj.innerText                                    ->  eleobj.value
-> eleobj.innerHTML  
                                           

=> settings/attributes manip:
    eleobj.attribute or eleobj.getAttribute("attr")
    eleobj.attribute = val   or eleobj.setAttribute("attr",value)
                               eleobj.removeAttribute("attr")
=> styles manip:
    eleobj.style.prop
    eleobj.style.prop=value
    eleobj.style.prop=0/none/"" ( for deletion )

=> events manip:
    //both are callbacks or anonymous 
 -> eleobj.event-name= code(write function)        ->  eleobj.addEventListener("event", code(write function))

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h3>demo on data manipulation</h3>
    <h1 id="heading">Hello</h1>
    <input type="text" id="tb" value="1000">
    <hr>
    <script>
        const h= document.getElementById("heading");
        document.write(`${h.innerText}<br>`);//printing the innerText of the tag using getElementbyId 
        // h.value is not worked beacuse h it output element not input element and value only work for input element
        // h.innerText = ""; // data is deleted , tag not deleted
        h.innerText+="World"; //appending the data 

        //Inside innerText we can not use the HTML while in innerHTML we can use HTML
        h.innerHTML+="&nbsp;World" //here we can use html tag with the innerHTML for manipulating the content

        const t = document.getElementById("tb"); 
        document.write(`${t.value}<br>`); //t.value only work on input elements 

        // t.value=""; // for deleting the textbox
        // t.value="apples"//modifying the data
        t.value += "apples"//appending the data
    </script>
</body>
</html>
