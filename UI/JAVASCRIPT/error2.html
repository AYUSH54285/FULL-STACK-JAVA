<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h3>Demo on error handling</h3>
        <label>First number</label><br>
        <input type="text" id="fn"><br>
        <label>Second number</label><br>
        <input type="text" id="sn"><br>
        <button onclick="add()">Addition</button>
        <br>
        <output id="op"></output>

        <script>
            function add(){
                try{
                    let x=eval(fn.value); //evaluate 
                    let y=eval(sn.value);
                    let res = x+y;
                    op.value=`sum is ${res}`;
                }catch(err){
                    op.value=`Invalid data`;
                    console.error(err);
                }

            }
        </script>

</body>
</html>
