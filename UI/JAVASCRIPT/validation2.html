Examples on validations
<!-- Examples on validations
 -->

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Validations</title>
		<style>
			span{
				color:red;
			}
		</style>
	</head>
	<body>
		<!--Validations Submitions-->
		<h2>Reset Password Form</h2>
		<form action="resetpw.jsp" method="post">
			<label>NEW PASSWORD</label><br>
			<input type="password" id="npwd" name="npwd">
			<span id="errnp"></span>
			<br>
			<br>
			<label>RETYPE PASSWORD</label><br>
			<input type="password" id="cpwd" name="cpwd">
			<span id="errcp"></span>
			<br>
			<br>
			<input type="submit" name="sb" value="Reset Password">
		</form>
		<script>
			//Password Checking
			document.forms[0].onsubmit = function(event){
				const npwd = document.querySelector("#npwd");
				const cpwd = document.querySelector("#cpwd");


				//clear previous error
				document.querySelector("#errnp").innerText="";
				document.querySelector("#errcp").innerText="";
				npwd.style.borderColor="";
				cpwd.style.borderColor="";
				
				let ch,upper=false,lower=false,dig=false,sym=false;
				let pw=npwd.value;
				//extracting 1 by 1 characters from password
				for(let i=0 ; i<pw.length ; i++){
					ch=pw[i];
					//checking char
					if(ch>='0' && ch<='9'){
						dig = true;
					}
					else if(ch>='A' && ch<='Z'){
						upper=true;
					}
					else if(ch>='a' && ch<='z'){
						lower = true;
					}
					else{
						sym=true;
					}
				}
				if(upper===false||lower===false||sym===false||dig===false||pw.length<8){
					document.querySelector("#errnp").innerText="Please set a valid password";
					npwd.style.borderColor="red";
					event.preventDefault();
				}
				//checking password and confirm password is same or not
				if(npwd.value!=cpwd.value){
					document.querySelector("#errcp").innerText="Both new and confirm password are not same";
					cpwd.style.borderColor="red";
					event.preventDefault(); //here event is nothing but it is event object and right now the event is onsubmit
				}
			}
		</script>
	</body>
</html>
