<!--
| Loop        | Best For              | Notes                                |
| ----------- | --------------------- | ------------------------------------ |
| `for...in`  | Objects               | Iterates keys (strings)              |
| `for...of`  | Arrays, strings, etc. | Iterates values                      |
| `forEach()` | Arrays                | Callback-based, no break/continue    |
| `for`       | Arrays or general use | Full control (index, break/continue) |

forEach():
array.forEach((element, index, array) => {
  // code
});

| Parameter | Meaning                          |
| --------- | -------------------------------- |
| `element` | The current element              |
| `index`   | The index of the current element |
| `array`   | The full array being looped      |

🔒 Important Notes:
❌ forEach does not return anything (undefined).

❌ You cannot use break or continue inside forEach.

✅ It’s best used for side effects like logging, DOM updates, etc.
-->
