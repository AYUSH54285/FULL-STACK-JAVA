<Html>
<head>

	<script>
	  //const book =Book();  <==	its invalid operation

	  const secondBook = new Book(); 
	  const thirdBook = new Book(); 

	  document.write(`${firstBook.name} ${firstBook.author} ${firstBook.price} ${firstBook.year}<br>`);           
	  document.write(`${secondBook.name} ${secondBook.author} ${secondBook.price} ${secondBook.year}<br>`);

	</script>
