<!--example on JS Control Statements-->
<h3>demo on while loop</h3>
<script>
   //to print 1 to 20 numbers
  let i=1;
  while(i<=20)
  {
    document.writeln(i);
    i++; 
  }
</script>
<h3>demo on for loop</h3>
<script>
  //to print 1 to 20 numbers
  for(let j=1; j<=20; j++)  //j is block level var
  {
	document.writeln(j);
  }
  //document.write(j);	error
</script>
<h3>demo on do while loop</h3>
<script>
  //to print 1 to 20 numbers
  let k=1;
  do{
	document.writeln(k);
	k++;
  }while(k<=20);
</script>
