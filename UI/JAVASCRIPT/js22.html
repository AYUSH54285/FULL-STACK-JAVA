<!--example on JS control statements-->
<h3>demo on if else if</h3>
<script>
    // js prefer around 240 if block otherwise performance will decrease
    let x=+prompt("enter first number");
    let y=+prompt("enter second number");

    if(x>y){
        document.write(x+" is big");
    }
    else if(y>x){
        document.write(y," is big");
    }
    else {
        document.write(x,"&",y," both are equal");
    }
</script>
