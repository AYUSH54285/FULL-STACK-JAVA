<!-- example on JS Control statements-->

<h3> HTML with loop</h3>
<select id="day">
    <script>
        for(let d=1 ; d<=31 ; d++){
            document.write('<option>'+d+'</option>');
        }
    </script>
</select>

<select id="month">
    <script>
        for(let m=1 ; m<=12 ; m++ ){
            document.write('<option>'+m+'</option>');
        }
    </script>
</select>

<select id="year">
    <script>
        for(let y=2025 ; y>=1900 ; y-- ){
            document.write('<option>'+y+'</option>');
        }
    </script>
</select>
