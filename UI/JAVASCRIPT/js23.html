<!--example on JS control statements-->
<h3>demo on switch case</h3>
<script>
    // switch is selection statement and it is faster then decision making statement


    let d=+prompt("enter value b/W 1 to 7");
    switch(d){
        case 1:
            document.write('Monday');
            break;
        case 2:
            document.write('Tuesday');
            break;
        case 3:
            document.write('Wednesday');
            break;                    
        case 4:
            document.write('Thursday');
            break;                        
        case 5:
            document.write('Friday');
            break;                            
        case 6:
            document.write('Saturday');
            break;
        case 7:
            document.write('Sunday');
            break;
        default:
            document.write('Invalid day');
    }

</script>
