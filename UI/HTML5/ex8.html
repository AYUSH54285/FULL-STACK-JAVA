<!--
a tag
=> anchor used to create hyperlinks
=> hyperlinks are used to move from one WP to another WP
	(navigations)
=> paired tag & inline element
  Syn:
		<a attrs> text </a>
		<a attrs> img </a>

=> target attribute used for open the link in same webpage(target="_self") or differnet webpage(target="_blank")
		
links => internal(within page moving like from top to bottom after clicking), external(move to different webpage)
-->

<!--
img tag
it is unpaired tag
used to display images on webpage
1 image tag is used for 1 image
it support all type of images
src=> this attribute used for providing the image path or link

absolute path => If we write the complete address of the tag then it is absolute path
relative path => if we write not complete address then it is called relative path
-->
