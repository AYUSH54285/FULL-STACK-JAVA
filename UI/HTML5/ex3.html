<!--
formatting tags
=> formatting tags are used to change the appearance of text
=> formatting tags also called as presentational tags
=> all are paired tags
 list: strong, b, em, i, del, s, ins, u, sub, sup, mark, span, small, big, pre

strong tag
=> used to print the data in strong format or bold format
     Syn:
	<strong> data </strong>
	<b> data </b>

em tag
=> used to print the data in italic format or emphasized format
    Syn:	
	<em> data </em>
	<i> data </i>

insert tag
=> used to represents newly inserted text or to print the data with underline
    Syn:
	<ins> data </ins>
	<u> data </u>

delete tag
=> used to represents deleted text or to strike out the data
    Syn:
	<del> data </del>
	<s> data </s>

sub tag
=> sub script, used to print the data below the base line
   Syn:
	<sub> data </sub>

sup tag
=> super script, used to print the data above the base line
   Syn:
	<sup> data </sup>

mark tag
=> used for marking data, mean its highliting the data with background yellow color
    Syn:
	<mark> data </mark>

small tag
=> used to display the data in small size
    Syn:
	<small> data </small>

span tag
=> used to print the data in plain format (w/o any format)
    Syn:
	<span> data </span>
     for highliting of text, error msg

   13 are inline elements

pre tag
=> pre formatted text, used to print the data as it is format 
    Syn:
	<pre> data </pre>

=> paired tag & block level element


      block level			inline 
=> line by line			=> side by side		
=> size of BL is full space		=> size of In is base on text
=> sup width & height 		=> not sup width & height
=> it sup alignment			=> not sup alignment
				Note: img, video, iframe are sup width, height
-->


<!-- example on formatting tags -->
