<!-- example on "input" tag -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>22th Webpage</title>
	<link rel="icon" href="logo.png">
  </head>
  <body>
	<h3>demo on password fields</h3>
	<label for="pw">enter password</label>
	<input type="password" id="pw">
	<br>
	<label for="cv">enter cvv</label>
	<input type="password" id="cv" maxlength="3">
	
	<h3>demo on number fields</h3>
	<input type="number">
	<br>
	<input type="number" min="0" max="500" step="10">
  </body>
</html>

<!-- URL Query String Structure
In a URL:
Everything before ? is the actual URL path (endpoint).
Everything after ? is the query string — used to send data to the server.
Each key-value pair is separated by an &.
https://example.com/search?query=books&category=education&page=2 -->
