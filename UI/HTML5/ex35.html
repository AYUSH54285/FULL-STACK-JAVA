<!-- 
figure :

The <figure> element is used for indicating self-contained 
content. The tag can include images, diagrams, illustrations, 
code examples, etc. 

figcaption :

The <figcaption> element is used for adding signature or 
annotation to the <figure> tag. 
Syn: 
<figure> 
Image 
<figcaption> caption/text </figcaption> 
</figure> 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <title>35th Webpage</title>
    <link rel="icon" href="logo.png">
</head>
<body>
    <h3>Demo on figures & figcaption tags</h3>
    <figure>
        <img src="images/abc.jpeg" width="200">
        <figcaption>AAAAAAAAAAAAAA</figcaption>
    </figure>
    <figure>
	  <img src="images/pqr.jpeg" width="200">
	  <figcaption>BBBBBBBBBBBBBBBB</figcaption>
	</figure>	
</body>
</html>
