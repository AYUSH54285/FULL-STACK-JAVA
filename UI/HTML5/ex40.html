<!-- 
 meta 
> data about data means we provide some info/details about a 
webpage. 
> meta is unpaired  
> meta is sub tag of <head> tag 
> by using meta we can provide info to browser, search engines, 
users/programmers. 
Define keywords for search engines: 
<meta name="keywords" content="HTML, CSS, JavaScript"> 
Define a description of your web page: 
<meta name="description" content="HTML and CSStutotrial"> 
Define the author of a page: 
<meta name="author" content="SK"> 
Refresh document: 
<meta name="refresh" content="45"> 
<meta http-equiv="refresh" content="time; url=URL"> 
Setting the viewport: 
<meta name="viewport" content="width=device-width, 
initial-scale=1.0">

| Tag           | Purpose                                                |
| ------------- | ------------------------------------------------------ |
| `charset`     | Declares character encoding (e.g., UTF-8)              |
| `viewport`    | Makes your site responsive on mobile devices           |
| `keywords`    | (SEO) Words search engines use to index the page       |
| `description` | (SEO) Short summary shown in search results            |
| `author`      | Sets the author's name                                 |
| `refresh`     | Automatically reloads the page after a certain time    |
| `http-equiv`  | Sends HTTP header info to the browser (e.g., redirect) |


 -->

<!-- example on meta tag -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>40th Webpage</title>
	<link rel="icon" href="logo.png">
	<!-- info to browser -->`
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<!-- info to SEO -->
	<meta name="keywords" content="word, word ">	 
	<meta name="description" content="HTML is the standard markup language for creating Web pages. What is HTML? HTML stands for Hyper Text Markup Language; HTML is the standard markup language">	
  </head>
  <body>
	<h3>demo on meta tag</h3>
	page content  200lines
  </body>
</html>
