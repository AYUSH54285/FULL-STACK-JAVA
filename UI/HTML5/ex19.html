 <!-- 
cell padding -> gap between content and box
cell spacing -> gap between box 

colspan -> merges columns    => example -> colspan="3" means merge 3 columns from current column
rowspan -> merge rows

=> both are use for repeatation of data
=> both should be applied on th and td only
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <table border cellpadding="25" cellspacing="0">
        <tr>
            <th>Roll No</th>
            <th> Name</th>
            <th>Phone number</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Ram</td>
            <td>8789</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Rahim</td>
            <td>7999</td>
        </tr>
        <tr>
            <td>3</td>
            <td>sonu</td>
            <td>70000000</td>
        </tr>
    </table> 
    
    <h3>demo on rowspan and colspan</h3>
    <table border cellpadding="20px" cellspacing="0">
        <thead>
            <tr>
                <!-- <th>AAA</th><th>BBB</th><th>BBB</th><th>BBB</th> -->
                <th>AAA</th><th colspan="3">BBB</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="4">A000</td><td>A100</td><td>A110</td><td>A111</td>
            </tr>
            <tr>
                <td>A200</td><td>A220</td><td>A222</td>
            </tr>
            <tr>
                <td>A300</td><td>A330</td><td>A333</td>
            </tr>
            <tr>
                <td>A400</td><td>A440</td><td>A444</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
