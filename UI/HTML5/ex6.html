<!--
=> both tags should be used in "head" section
=> tab
what is default title => program name
what is default icon/logo => www/globe symbol


link tag
=> used to set icon/logo for a webpage
   it sup .jpg,.png,.ico,.svg,.bmp,.webp
   it is unpaired tag
   syn:
      <link rel="icon" href="image address"/>
         relative => icon,stylesheet         (optional)
         hyper referernce => address of image        (specific)
-->

<!-- example on title & link tags -->
<!DOCTYPE html>
<html lang="en">   
   <head>
      <title>Login Page</title>
      <link rel="icon" href="logo.png"/>
   </head>
   <body>
      <h2>demo on setting web page title & logo</h2>      
  </body>
</html>
