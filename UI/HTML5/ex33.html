<!-- 
details and summary :

=>details and summary tags are used to allow the user to 
expand/collapse some information, when the user clicks on the 
heading. 
=>both are paired& block level 
=> details tag is the main tag and summary is the sub tag of 
details tag. 
=>Syn: 
<details> 
<summary>Short info</summary> 
Detailed Information 
</details>  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <title>33th Webpage</title>
    <link rel="icon" href="logo.png">
</head>
<body>
    <h3>Demo on details & summary tags(accordion)</h3>
    <details>
        <summary>Colors</summary>
        <ul>
            <li>Red</li>
            <li>Yellow</li>
            <li>Blue</li>
            <li>Green</li>
            <li>Back</li>
        </ul>
    </details>
    <details>
        <summary>Images</summary>
        <div>
            <img src="images/abc.jpeg" width="150">
            <img src="images/xyz.jpeg" width="150">
            <img src="images/pqr.jpeg" width="150">
        </div>
    </details>
</body>
</html>
